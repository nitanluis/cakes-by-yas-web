name: Verify live production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check production and permanent redirects
        run: node scripts/verify-production.mjs https://cakesbyyas.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: audit/production-live.json
          retention-days: 14
